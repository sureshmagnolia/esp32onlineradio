[platformio]
src_dir = .

[env:esp32s3_jc3248w535]
platform = espressif32
board = esp32-s3-devkitc-1
framework = arduino

; Target MCU & Speed
board_build.mcu = esp32s3
board_build.f_cpu = 240000000L
board_build.f_flash = 80000000L
board_build.flash_mode = qio
board_build.flash_size = 16MB
board_build.partitions = default_16MB.csv

; 8MB Octal PSRAM & Native USB-CDC Configuration
build_flags =
    -DCORE_DEBUG_LEVEL=1
    -DARDUINO_USB_CDC_ON_BOOT=1
    -DARDUINO_USB_MODE=1
    -DBOARD_HAS_PSRAM
    -mfix-esp32-psram-cache-issue
    -Isrc
    -I../libraries/ESP32-audioI2S/src
    -I../libraries/lvgl

lib_extra_dirs =
    ../libraries

upload_port = COM8
monitor_port = COM8
monitor_speed = 115200
upload_speed = 921600
